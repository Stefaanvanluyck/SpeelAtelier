<!DOCTYPE html>
<html lang="nl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valerie's Speelatelier</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- EMAILJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>

        *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:"Poppins", Arial, sans-serif;
        }

        :root{
        --bg:#f5f7f2;
        --card:#ffffffcc;
        --text:#253225;
        --accent:#ff8b94;
        --accent2:#ffd6a5;
        --shadow:0 10px 35px rgba(0,0,0,0.08);
        --blur:blur(14px);
        }

        body{
        background:
        radial-gradient(circle at top left,#fdf2f4 0%,transparent 30%),
        radial-gradient(circle at bottom right,#eef8e9 0%,transparent 30%),
        var(--bg);
        color:var(--text);
        line-height:1.7;
        scroll-behavior:smooth;
        overflow-x:hidden;
        }

        nav{
        position:fixed;
        top:20px;
        left:50%;
        transform:translateX(-50%);
        width:calc(100% - 40px);
        max-width:1200px;
        background:rgba(255,255,255,0.75);
        backdrop-filter:var(--blur);
        -webkit-backdrop-filter:var(--blur);
        padding:18px 30px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        border-radius:24px;
        border:1px solid rgba(255,255,255,0.6);
        box-shadow:0 8px 30px rgba(0,0,0,0.06);
        z-index:1000;
        }

        nav strong{
        font-size:1.1rem;
        }

        nav a{
        margin-left:22px;
        text-decoration:none;
        color:var(--text);
        font-weight:600;
        cursor:pointer;
        }

        .hero{
        height:100vh;
        background:
        linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.45)),
        url('https://images.unsplash.com/photo-1607453998774-d533f65dac99?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        color:white;
        }

        .hero-content{
        max-width:800px;
        padding:50px;
        border-radius:35px;
        background:rgba(255,255,255,0.08);
        backdrop-filter:blur(8px);
        }

        .hero h1{font-size:4.5rem;}

        .btn{
        display:inline-block;
        margin-top:28px;
        padding:16px 34px;
        background:linear-gradient(135deg,var(--accent),#ffb38a);
        color:white;
        border-radius:999px;
        border:none;
        cursor:pointer;
        }

        section{
        padding:120px 20px;
        max-width:1150px;
        margin:auto;
        }

        h2{
        text-align:center;
        font-size:3rem;
        margin-bottom:55px;
        }

        .grid{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
        gap:30px;
        }

        .card{
        background:var(--card);
        border-radius:28px;
        overflow:hidden;
        box-shadow:var(--shadow);
        }

        .card img{
        width:100%;
        height:240px;
        object-fit:cover;
        }

        .card-content{padding:25px;}

        .teacher{
        display:flex;
        flex-wrap:wrap;
        gap:50px;
        padding:50px;
        border-radius:35px;
        background:rgba(255,255,255,0.55);
        }

        .teacher img{
        width:300px;
        border-radius:30px;
        }

        .gallery{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
        gap:20px;
        }

        .gallery img{
        width:100%;
        height:220px;
        object-fit:cover;
        border-radius:24px;
        }

        .faq-item{
        background:rgba(255,255,255,0.75);
        padding:25px;
        border-radius:24px;
        margin-bottom:18px;
        cursor:pointer;
        }

        .faq-answer{display:none;margin-top:10px;}

        .modal{
        display:none;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,0.55);
        justify-content:center;
        align-items:center;
        }

        .modal-content{
        background:white;
        padding:35px;
        border-radius:28px;
        width:90%;
        max-width:420px;
        }

        .modal-content input{
        width:100%;
        margin:10px 0;
        padding:14px;
        border-radius:14px;
        border:1px solid #ddd;
        }

        footer{
        background:#263126;
        color:white;
        text-align:center;
        padding:70px 20px;
        }

    </style>

</head>

<body>

<nav>
    <strong>🌿 Valerie's Speelatelier</strong>
    <div>
        <a href="#over">Speelatelier</a>
        <a href="#overmij">Juf Valerie</a>
        <a href="#activiteiten">Activiteiten</a>
        <a onclick="openForm()">Inschrijven</a>
    </div>
</nav>

<div class="hero">
    <div class="hero-content">
        <h1>Valerie's Speelatelier</h1>
        <p>Warm, rustig en speels ontdekken</p>
        <a onclick="openForm()" class="btn">Schrijf je in 💛</a>
    </div>
</div>

<section id="over">
    <h2>Over</h2>
    <p style="text-align:center;">Spelend leren voor jonge kinderen.</p>
</section>

<section id="activiteiten">
    <h2>Activiteiten</h2>

    <div class="grid">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1607453998774-d533f65dac99">
            <div class="card-content">
                <h3>Water</h3>
            </div>
        </div>

    </div>
</section>

<div class="modal" id="modal">

    <div class="modal-content">

        <h3>Inschrijving 🌿</h3>

        <input type="date" id="datePicker">
        <input type="text" id="name" placeholder="Naam">
        <input type="email" id="email" placeholder="E-mail">

        <button class="btn" onclick="submitForm()">Bevestigen</button>
        <button class="btn" style="background:#aaa" onclick="closeForm()">Sluiten</button>

        <p id="confirm"></p>

    </div>

</div>

<footer>
    Valerie's Speelatelier 🌿
</footer>

<script>

    // EMAILJS INIT
    (function(){
        emailjs.init("ryf0HAbDqTzY368PW");
    })();

    function openForm(){
        document.getElementById("modal").style.display="flex";
    }

    function closeForm(){
        document.getElementById("modal").style.display="none";
    }

  function submitForm(){

    let selectedDate = document.getElementById("datePicker").value;
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;

    if(!selectedDate || !name || !email){
        alert("Vul alles in 💛");
        return;
    }

    // 1. MAIL NAAR JOU (admin template)
    emailjs.send("service_9u8ex4o", "template_m20bheg", {
        name: name,
        email: email,
        date: selectedDate
    });

    // 2. MAIL NAAR KLANT (optioneel)
    emailjs.send("service_9u8ex4o", "template_nndh15x", {
        name: name,
        email: email,
        date: selectedDate
    })
    .then(()=>{
        document.getElementById("confirm").innerText =
        "💛 Inschrijving verzonden!";
    })
    .catch((err)=>{
        console.log(err);
        alert("Er ging iets mis");
    });
}

    document.querySelectorAll(".faq-item").forEach(item=>{
        item.addEventListener("click",()=>{
            let a=item.querySelector(".faq-answer");
            a.style.display=a.style.display==="block"?"none":"block";
        });
    });

</script>

</body>
</html>
