<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Kalender</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales-all.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root{
            --text:#0f172a;
            --border:rgba(15,23,42,.08);
        }

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
            background:linear-gradient(135deg,#fce7f3,#e0f2fe,#ecfdf5);
            min-height:100vh;
            color:var(--text);
        }

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px;
        }

        h1{
            margin:0;
            font-size:24px;
            font-weight:900;
        }

        .btn{
            border:none;
            cursor:pointer;
            padding:12px 16px;
            border-radius:12px;
            font-weight:700;
        }

        .logout{
            background:#111827;
            color:white;
        }

      #calendarWrapper{
    max-width:1300px;
    margin:0 auto 30px;
    padding:15px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

      #calendar{
    background:white;
    border-radius:20px;
    padding:15px;
    box-shadow:0 15px 40px rgba(0,0,0,.08);
    min-width:900px;
}

        .fc-toolbar-title{
            font-size:1.4rem !important;
            font-weight:800 !important;
        }

        .fc-event{
            cursor:pointer;
            border:none !important;
            padding:2px;
        }

        .fc-daygrid-event{
            border-radius:8px !important;
        }

        #modal{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.45);
            display:none;
            justify-content:center;
            align-items:center;
            z-index:999;
            padding:15px;
        }

        .modal-box{
            background:white;
            width:100%;
            max-width:420px;
            border-radius:20px;
            padding:20px;
        }

        .modal-box h3{
            margin-top:0;
        }

        .modal-box input{
            width:100%;
            margin-bottom:10px;
            padding:12px;
            border-radius:10px;
            border:1px solid #ddd;
        }

        .modal-actions{
            display:flex;
            justify-content:space-between;
            gap:10px;
        }

        .save{
            background:#22c55e;
            color:white;
        }

        .deleteBtn{
            background:#ef4444;
            color:white;
        }

        .cancel{
            background:#e5e7eb;
        }

        #dashboard{
    max-width:1300px;
    margin:20px auto;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.stat-label{
    color:#64748b;
    font-size:14px;
}

.stat-value{
    font-size:34px;
    font-weight:900;
    margin-top:8px;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
    margin-bottom:25px;
}

.dashboard-card{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

@media(max-width:900px){
    .dashboard-grid{
        grid-template-columns:1fr;
    }
}

.admin-section {
    max-width: 1300px;
    margin: 20px auto;
    padding: 15px;
}

.admin-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;

    background: rgba(255,255,255,.7);
    backdrop-filter: blur(12px);

    padding: 12px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);

    width: 100%;
}

.admin-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;

    background:rgba(255,255,255,.7);
    backdrop-filter:blur(12px);

    padding:12px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.admin-group input{
    padding:10px 12px;
    border-radius:12px;
    border:1px solid #e5e7eb;
    outline:none;
    font-size:14px;
    min-width:160px;
}

.btn.danger{
    background:linear-gradient(135deg,#ef4444,#f97316);
    color:white;
    box-shadow:0 10px 25px rgba(239,68,68,.25);
    transition:.2s;
}

.btn.danger:hover{
    transform:translateY(-2px);
}

        @media(max-width:600px){
    .admin-group{
        flex-direction:column;
        align-items:stretch;
    }

    .admin-group input,
    .admin-group button{
        width:100%;
    }
}


        .booking-status-card{
    max-width:1300px;
    margin:20px auto;
    padding:20px;
    border-radius:20px;
    background:linear-gradient(135deg,#ffffff,#f8fafc);
    box-shadow:0 15px 40px rgba(0,0,0,.08);
    border:1px solid rgba(15,23,42,.06);
}

.booking-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.booking-header h2{
    margin:0;
    font-size:20px;
    font-weight:900;
}

.status-badge{
    padding:6px 12px;
    border-radius:999px;
    font-weight:800;
    font-size:12px;
}

.status-badge.on{
    background:#dcfce7;
    color:#166534;
}

.status-badge.off{
    background:#fee2e2;
    color:#991b1b;
}

.toggle-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    margin-top:10px;
}

.status-text{
    margin-top:10px;
    font-size:14px;
    color:#64748b;
}

    </style>
</head>
<body>

<div class="topbar">
    <h1>📅 Admin Tool</h1>

    <button class="btn logout" onclick="logout()">
        Uitloggen
    </button>
</div>

<div class="admin-bar">

    <div class="booking-status-card">
        <div class="booking-header">
            <h2>📅 Inschrijvingen</h2>
            <span id="bookingStatusBadge" class="status-badge"></span>
        </div>

        <label class="toggle-row">
            <input type="checkbox" id="bookingToggle" onchange="updateBookingStatus()">
            <span>Inschrijvingen activeren</span>
        </label>

        <p id="bookingStatusText" class="status-text"></p>
    </div>

    <div class="admin-section">

        <div style="padding:15px; background:#fff; border-radius:12px; margin-bottom:20px;">
        <div class="admin-group">
            <input type="date" id="themeDate">
            <input type="text" id="themeName" placeholder="Thema (bv. Dino's)">
            <button class="btn save" onclick="saveTheme()">🎨 Thema opslaan</button>
        </div>

        <div class="admin-group">
            <input type="date" id="blockDate">
            <input type="text" id="blockReason" placeholder="Reden (bv. vakantie)">
            <button class="btn danger" onclick="addBlockedDate()">⛔ Blokkeren</button>
        </div>

    </div>



<div id="calendarWrapper">
    <div id="calendar"></div>
</div>




<div id="modal">
    <div class="modal-box">

        <h3>✏️ Afspraak beheren</h3>

        <input id="editName" placeholder="Naam">

        <input id="editEmail" placeholder="Email">

        <input id="editDate" type="date">

        <div class="modal-actions">

            <button class="btn deleteBtn" onclick="deleteAppointment()">
                Verwijderen
            </button>

            <button class="btn cancel" onclick="closeModal()">
                Sluiten
            </button>

            <button class="btn save" onclick="saveEdit()">
                Opslaan
            </button>

        </div>

    </div>
</div>

<div id="dashboard">

    <div class="stats-grid">

        <div class="stat-card">
            <div class="stat-label">Totaal inschrijvingen</div>
            <div class="stat-value" id="totalAppointments">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Deze maand</div>
            <div class="stat-value" id="monthAppointments">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Groei t.o.v. vorige maand</div>
            <div class="stat-value" id="growthPercentage">0%</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Unieke personen</div>
            <div class="stat-value" id="uniquePeople">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">💶 Totale inkomsten</div>
            <div class="stat-value" id="totalRevenue">€0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">💶 Deze maand</div>
            <div class="stat-value" id="monthRevenue">€0</div>
        </div>

    </div>

    <div class="dashboard-grid">

        <div class="dashboard-card">
            <h3>📈 Inschrijvingen per maand</h3>
            <canvas id="monthlyChart"></canvas>
        </div>

        <div class="dashboard-card">
            <h3>🏆 Top ingeschreven personen</h3>
            <div id="topUsers"></div>
        </div>

    </div>



</div>

<script>

    const sb = supabase.createClient(
    "https://nafajvywiknelkgufpac.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hZmFqdnl3aWtuZWxrZ3VmcGFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMTQ4ODcsImV4cCI6MjA5Nzc5MDg4N30.ZIrDry9i5slXuyZnSgd6L-baKI72ZtczX1nvoT3Azck"
    );

        let blockedDates = [];
        let allData = [];
        let calendar;
        let editId = null;
        let themes = [];
        let editMode = "appointment"; // of "theme"

        async function loadData(){

            const { data, error } = await sb
                .from("appointments")
                .select("*")
                .order("appointment_date");

            if(error){
                console.error(error);
                return;
            }

            allData = data || [];
updateDashboard();

await loadBlockedDates();
await loadThemes();

renderCalendar();
        }

        function renderCalendar(){

            const calendarEl = document.getElementById("calendar");

            const events = allData.map(item => ({

                id: item.id,

                title: item.name,

                start: item.appointment_date,

                allDay: true,

                extendedProps:{
                    email:item.email
                }

            }));
            const themeEvents = themes.map(themeItem => {



return {
    title: "➡️ Thema: " + themeItem.theme,
    start: themeItem.date,
    allDay: true,
    backgroundColor: "#dbeafe",
    borderColor: "#60a5fa",
    textColor: "#1e3a8a",
    extendedProps: {
        type: "theme",
        theme: themeItem.theme,
        date: themeItem.date
    }
};
});

const allEvents = [
    ...events,
    ...themeEvents
];

            if(calendar){
                calendar.destroy();
            }

            calendar = new FullCalendar.Calendar(calendarEl, {

                locale:'nl',

                initialView:'dayGridMonth',

                height:'auto',

                headerToolbar:{
                    left:'prev,next today',
                    center:'title',
                    right:'dayGridMonth,timeGridWeek,timeGridDay'
                },

                buttonText:{
                    today:'Vandaag',
                    month:'Maand',
                    week:'Week',
                    day:'Dag'
                },

events: allEvents,

dayCellDidMount: function(info) {

   const dateStr = info.date.toLocaleDateString("en-CA");

    const blocked = blockedDates.find(d => d.date === dateStr);

    if (blocked) {
        info.el.style.backgroundColor = "#fee2e2";
        info.el.style.color = "#fee2e2";
        info.el.title = "⛔ " + blocked.reason;
    }
},

eventClick: function(info) {

    const event = info.event;
    const isTheme = event.extendedProps.type === "theme";

    editMode = isTheme ? "theme" : "appointment";

    editId = isTheme
        ? event.extendedProps.date
        : event.id;

    document.querySelector("#modal h3").innerText =
        isTheme ? "🎨 Thema beheren" : "✏️ Afspraak beheren";

    document.getElementById("editDate").value = event.startStr;

    if (isTheme) {

        document.getElementById("editName").value =
            event.extendedProps.theme || "";

        document.getElementById("editEmail").style.display = "none";

    } else {

        document.getElementById("editName").value =
            event.title;

        document.getElementById("editEmail").style.display = "block";
        document.getElementById("editEmail").value =
            event.extendedProps.email || "";
    }

    // 👇 HIER PLAATS JE HET
    document.querySelector(".deleteBtn").onclick =
        isTheme ? deleteTheme : deleteAppointment;

    document.getElementById("modal").style.display = "flex";
}
            });

            calendar.render();
            renderBlockedDates();

        }

        function closeModal(){
            document.getElementById("modal").style.display = "none";
        }

async function saveEdit(){

    const name = document.getElementById("editName").value;
    const date = document.getElementById("editDate").value;

    const isTheme = editMode === "theme";

    if(isTheme){

        const { error } = await sb
            .from("themes")
            .update({
                theme: name,
                date: date
            })
            .eq("date", editId);

        if(error){
            alert(error.message);
            return;
        }

    } else {

        const email = document.getElementById("editEmail").value;

        const { error } = await sb
            .from("appointments")
            .update({
                name,
                email,
                appointment_date: date
            })
            .eq("id", editId);

        if(error){
            alert(error.message);
            return;
        }
    }

    closeModal();
    loadData();
}
       async function deleteAppointment(){

    if(!confirm("Afspraak verwijderen?")){
        return;
    }

    if(editMode === "theme"){
        alert("Je kan geen thema verwijderen via deze knop.");
        return;
    }

    const { error } = await sb
        .from("appointments")
        .delete()
        .eq("id", editId);

    if(error){
        alert(error.message);
        return;
    }

    closeModal();
    loadData();
}

async function deleteTheme(){

    if(!confirm("Thema verwijderen?")){
        return;
    }

    const { error } = await sb
        .from("themes")
        .delete()
        .eq("date", editId);

    if(error){
        alert(error.message);
        return;
    }

    closeModal();
    loadData();
}


        sb.channel("appointments-live")
        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"appointments"
            },
            () => {
                loadData();
            }
        )
        .subscribe();

        function logout(){

            localStorage.removeItem("loggedIn");

            window.location.href = "index.html";
        }

        loadData();

    let monthlyChart;

function updateDashboard(){

    document.getElementById("totalAppointments").textContent =
        allData.length;

    const uniqueNames =
        new Set(allData.map(x => x.name));

    document.getElementById("uniquePeople").textContent =
        uniqueNames.size;

    const now = new Date();

    const thisMonth =
        allData.filter(x => {

            const d = new Date(x.appointment_date);

            return d.getMonth() === now.getMonth()
                && d.getFullYear() === now.getFullYear();

        });

    document.getElementById("monthAppointments").textContent =
        thisMonth.length;

    const previousMonth = new Date();
    previousMonth.setMonth(previousMonth.getMonth() - 1);

    const prevMonthCount =
        allData.filter(x => {

            const d = new Date(x.appointment_date);

            return d.getMonth() === previousMonth.getMonth()
                && d.getFullYear() === previousMonth.getFullYear();

        }).length;

    let growth = 0;

    if(prevMonthCount > 0){
        growth =
            Math.round(
                ((thisMonth.length - prevMonthCount) /
                prevMonthCount) * 100
            );
    }

    document.getElementById("growthPercentage").textContent =
        growth + "%";

    renderMonthlyChart();
    renderTopUsers();


    // Inkomsten berekenen
let totalRevenue = 0;
let monthRevenue = 0;

const groupedBookings = {};

allData.forEach(item => {
    const key = item.email + "_" + item.appointment_date;

    if (!groupedBookings[key]) {
        groupedBookings[key] = [];
    }

    groupedBookings[key].push(item);
});

Object.values(groupedBookings).forEach(group => {

    group.forEach((booking, index) => {

        const amount = index === 0 ? 18 : 15;

        totalRevenue += amount;

        const d = new Date(booking.appointment_date);

        if (
            d.getMonth() === now.getMonth() &&
            d.getFullYear() === now.getFullYear()
        ) {
            monthRevenue += amount;
        }

    });

});

document.getElementById("totalRevenue").textContent =
    "€" + totalRevenue;

document.getElementById("monthRevenue").textContent =
    "€" + monthRevenue;
}


    function renderMonthlyChart(){

    const months = {};

    allData.forEach(item => {

        const d = new Date(item.appointment_date);

        const key =
            d.getFullYear() + "-" +
            String(d.getMonth()+1).padStart(2,'0');

        months[key] =
            (months[key] || 0) + 1;
    });

    const labels = Object.keys(months);
    const values = Object.values(months);

    if(monthlyChart){
        monthlyChart.destroy();
    }

    monthlyChart = new Chart(
        document.getElementById("monthlyChart"),
        {
            type:'line',

            data:{
                labels,
                datasets:[{
                    label:'Inschrijvingen',
                    data:values,
                    tension:.35
                }]
            }
        }
    );
}


    function renderTopUsers(){

    const counts = {};

    allData.forEach(item => {

        counts[item.name] =
            (counts[item.name] || 0) + 1;

    });

    const top =
        Object.entries(counts)
            .sort((a,b) => b[1]-a[1])
            .slice(0,10);

    document.getElementById("topUsers").innerHTML =
        top.map(user => `
            <div style="
                display:flex;
                justify-content:space-between;
                padding:10px 0;
                border-bottom:1px solid #eee;
            ">
                <span>${user[0]}</span>
                <strong>${user[1]}</strong>
            </div>
        `).join("");
}

async function loadBookingStatus() {
  const { data, error } = await sb
    .from("settings")
    .select("*")
    .eq("key", "booking_enabled")
    .single();

  if (error) {
    console.error(error);
    return;
  }

  const enabled = data.value;

  document.getElementById("bookingToggle").checked = enabled;
  document.getElementById("bookingStatusText").innerText =
    enabled ? "✅ Inschrijvingen staan AAN" : "⛔ Inschrijvingen staan UIT";
}

async function updateBookingStatus() {
  const enabled = document.getElementById("bookingToggle").checked;

  const { error } = await sb
    .from("settings")
    .upsert(
      {
        key: "booking_enabled",
        value: enabled
      },
      {
        onConflict: "key"
      }
    );

  if (error) {
    console.error(error);
    alert("Toggle fout");
    return;
  }

  loadBookingStatus();
}

async function addBlockedDate() {
  const date = document.getElementById("blockDate").value;
  const reason = document.getElementById("blockReason").value;

  const { error } = await sb
    .from("blocked_dates")
    .insert({ date, reason });

  if (error) {
    alert(error.message);
    return;
  }

  loadData();
}



async function loadBlockedDates() {
  const { data, error } = await sb
    .from("blocked_dates")
    .select("*");

  if (error) {
    console.error(error);
    return;
  }

  blockedDates = data || [];

  // als calendar al bestaat → refresh overlay
if (calendar) {
    renderBlockedDates();
}
}


    function renderBlockedDates() {

  const blockedEvents = blockedDates.map(d => ({
    title: "⛔ " + d.reason,
    start: d.date,
    allDay: true,
    display: "background",
    color: "#ef4444"
  }));

  calendar.addEventSource(blockedEvents);
}


    async function saveTheme() {

    const date =
        document.getElementById("themeDate").value;

    const theme =
        document.getElementById("themeName").value;

    if (!date || !theme) {
        alert("Datum en thema invullen");
        return;
    }

    const { error } = await sb
        .from("themes")
        .upsert(
            {
                date,
                theme
            },
            {
                onConflict: "date"
            }
        );

    if (error) {
        alert(error.message);
        return;
    }

    alert("✅ Thema opgeslagen");

    loadData();
}


    async function loadThemes() {

    const { data, error } = await sb
        .from("themes")
        .select("*");

    if(error){
        console.error(error);
        return;
    }

    themes = data || [];
}


</script>

</body>
</html>
