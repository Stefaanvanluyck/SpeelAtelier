
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Admin - Inschrijvingen</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --text: #1f2937;
            --muted: #6b7280;
            --card: rgba(255,255,255,0.85);
            --border: rgba(255,255,255,0.4);
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
            color: var(--text);
            padding: 16px;

            /* ✨ matching soft website background */
            background: linear-gradient(135deg, #fce7f3, #e0f2fe, #ecfdf5);
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            margin: 10px 0 18px;
        }

        /* TOPBAR */
        #topbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .btn {
            background: rgba(17,24,39,0.9);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        /* FILTER */
        #filterBar {
            max-width: 720px;
            margin: 0 auto 14px;
            background: var(--card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.08);
            font-size: 14px;
            background: white;
            outline: none;
        }

        /* CONTAINER */
        #container {
            display: grid;
            gap: 14px;
            max-width: 720px;
            margin: 0 auto;
        }

        /* DAY CARD */
        .day {
            background: var(--card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
        }

        .day:hover {
            transform: translateY(-2px);
            transition: 0.2s ease;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .date {
            font-weight: 900;
            font-size: 15px;
        }

        /* badge softer */
        .badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(0,0,0,0.06);
            font-weight: 700;
        }

        /* PERSON */
        .person {
            padding: 8px 0;
            border-top: 1px solid rgba(0,0,0,0.06);
        }

        .person:first-of-type {
            border-top: none;
        }

        .name {
            font-size: 14px;
            font-weight: 700;
        }

        .email {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        /* EMPTY */
        .empty {
            text-align: center;
            padding: 40px;
            color: var(--muted);
            font-size: 14px;
        }

        /* MOBILE */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .day {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<div id="topbar">
    <button class="btn" onclick="logout()">Uitloggen</button>
</div>

<h1>📋 Inschrijvingen</h1>

<div id="filterBar">
    <select id="dateFilter" onchange="filterData()">
        <option value="all">Alle datums</option>
    </select>
</div>

<div id="container"></div>

<script>
    const supabaseUrl = "https://nafajvywiknelkgufpac.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hZmFqdnl3aWtuZWxrZ3VmcGFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMTQ4ODcsImV4cCI6MjA5Nzc5MDg4N30.ZIrDry9i5slXuyZnSgd6L-baKI72ZtczX1nvoT3Azck";


        const sb = supabase.createClient(supabaseUrl, supabaseKey);

        const MAX_PER_DAY = 10;
        let allData = [];

        /* LOAD */
        async function loadData() {
            const { data } = await sb
                .from("appointments")
                .select("*")
                .order("appointment_date", { ascending: false });

            allData = data || [];
            setupFilter();
            render(allData);
        }

        /* FILTER */
        function setupFilter() {
            const select = document.getElementById("dateFilter");

            const dates = [...new Set(allData.map(d => d.appointment_date))];

            select.innerHTML =
                `<option value="all">Alle datums</option>` +
                dates.map(d => `<option value="${d}">${d}</option>`).join("");
        }

        function filterData() {
            const val = document.getElementById("dateFilter").value;

            if (val === "all") {
                render(allData);
            } else {
                render(allData.filter(d => d.appointment_date === val));
            }
        }

        /* RENDER */
        function render(data) {
            const container = document.getElementById("container");
            container.innerHTML = "";

            if (!data.length) {
                container.innerHTML = `<div class="empty">Geen inschrijvingen</div>`;
                return;
            }

            const grouped = {};

            data.forEach(item => {
                if (!grouped[item.appointment_date]) {
                    grouped[item.appointment_date] = [];
                }
                grouped[item.appointment_date].push(item);
            });

            Object.keys(grouped).forEach(date => {
                const people = grouped[date];

                const card = document.createElement("div");
                card.className = "day";

                card.innerHTML = `
                    <div class="header">
                        <div class="date">📅 ${date}</div>
                        <div class="badge">${people.length}/${MAX_PER_DAY}</div>
                    </div>

                    ${people.map(p => `
                        <div class="person">
                            <div class="name">${p.name}</div>
                            <div class="email">${p.email}</div>
                        </div>
                    `).join("")}
                `;

                container.appendChild(card);
            });
        }

        /* LOGOUT */
        function logout() {
            localStorage.removeItem("loggedIn");
            window.location.href = "index.html";
        }

        loadData();
        setInterval(loadData, 10000);
</script>

</body>
</html>
